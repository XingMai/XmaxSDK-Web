<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Camera exposure browser check</title>
<body>
  <h1>Camera exposure browser check</h1>
  <p>Uses synthetic canvas streams only. No camera, microphone, or backend calls.</p>
  <button id="run">Run checks</button>
  <pre id="results">Not run</pre>
  <script type="module">
    import { waitForValidCameraFrame } from "../../src/Foundation/Media/Camera/CameraFrameValidator.ts";

    const results = document.querySelector("#results");
    const button = document.querySelector("#run");
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    async function check(name, { dark = false, abort = false, fallback = false, brightInitially = false } = {}) {
      const canvas = document.createElement("canvas");
      canvas.width = 320;
      canvas.height = 240;
      const context = canvas.getContext("2d");
      const started = performance.now();
      let firstBrightAt;
      const paint = () => {
        const elapsed = performance.now() - started;
        const value = dark || (!brightInitially && elapsed < 600) ? 0 : 100;
        if (value && firstBrightAt === undefined) firstBrightAt = elapsed;
        context.fillStyle = `rgb(${value},${value},${value})`;
        context.fillRect(0, 0, 320, 240);
        // 模拟边缘灯光；不应让中央黑帧通过检查。
        context.fillStyle = "white";
        context.fillRect(0, 0, 320, 30);
      };
      paint();
      const interval = setInterval(paint, 33);
      const stream = canvas.captureStream(30);
      const track = stream.getVideoTracks()[0];
      const controller = new AbortController();
      const originalCallback = HTMLVideoElement.prototype.requestVideoFrameCallback;
      if (fallback) HTMLVideoElement.prototype.requestVideoFrameCallback = undefined;
      const cancel = abort ? setTimeout(() => controller.abort(), 100) : undefined;
      try {
        let error;
        try { await waitForValidCameraFrame(track, controller.signal); } catch (caught) { error = caught; }
        const elapsed = Math.round(performance.now() - started);
        if (abort) assert(error?.code === "CANCELLED", "Expected cancellation");
        else if (dark) {
          assert(!error, "Dark environment should not fail startup");
          assert(elapsed >= 2_000, "Expected timeout fallback");
        }
        else {
          assert(!error, error?.message);
          assert(firstBrightAt !== undefined, "Released before a bright frame existed");
          if (!brightInitially) {
            assert(elapsed - firstBrightAt < 300,
              `Unexpected extra wait: ready=${elapsed} ms, first bright=${Math.round(firstBrightAt)} ms`);
          }
        }
        assert(track.readyState === "live", "Sampling must not stop the source track");
        assert(document.querySelectorAll("video").length === 0, "Leaked sampling video");
        results.textContent += `\nPASS ${name}: ${elapsed} ms`;
      } finally {
        clearInterval(interval);
        clearTimeout(cancel);
        track.stop();
        HTMLVideoElement.prototype.requestVideoFrameCallback = originalCallback;
      }
    }
    button.addEventListener("click", async () => {
      button.disabled = true;
      results.textContent = "Running";
      try {
        await check("initial frame already bright", { brightInitially: true });
        await check("first bright frame after dark frames");
        await check("persistent dark frames", { dark: true });
        await check("cancel while sampling", { abort: true });
        await check("polling fallback", { fallback: true });
        results.textContent += "\nAll checks passed";
      } catch (error) { results.textContent += `\nFAIL ${error.message}`; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
